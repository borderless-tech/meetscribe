[project]
name = "meetscribe"
version = "0.1.0"
description = "Local, offline, dual-track meeting recorder + diarized transcriber with speaker embeddings"
readme = "README.md"
requires-python = "==3.12.*"
# NOTE: ML runtime deps (sherpa-onnx + its split native dists) are pinned to
# EXACT versions in the C7 flake chunk, informed by the pre-implementation
# research report (docs/plans/2026-08-02-meetscribe-research.md). numpy is the
# only always-needed pure dep. Versions are pinned (==), never (>=), so the
# uv.lock / uv2nix closure is reproducible for any developer we ship the flake to.
dependencies = [
    "numpy==2.2.6",
    # sherpa-onnx (CPU, ONNX Runtime) is split across two PyPI distributions:
    #   - sherpa-onnx       : the pybind11 extension (import sherpa_onnx)
    #   - sherpa-onnx-core  : the native runtime lib (libsherpa-onnx*.so)
    # The core dep is declared `Dynamic: requires-dist` — it lives ONLY in the wheel
    # metadata, not the sdist — so uv/pip resolving off the sdist silently drops it and
    # `import sherpa_onnx` then fails at runtime. We therefore pin BOTH explicitly.
    # (See docs/plans/2026-08-02-meetscribe-research.md §1 + build-time checklist #1/#2.)
    "sherpa-onnx==1.13.4",
    "sherpa-onnx-core==1.13.4",
    "rich==14.2.0",
]

[project.scripts]
meetscribe = "meetscribe.cli:main"

[dependency-groups]
# Dev-only tooling. Kept out of the runtime closure (workspace.deps.default).
dev = [
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
