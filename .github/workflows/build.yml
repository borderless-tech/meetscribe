name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-14        # Apple Silicon
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Optional: push build results to Cachix. No-op if CACHIX_AUTH_TOKEN is unset
      # (e.g. on PRs from forks) — the build still runs, just without cache push.
      - uses: cachix/cachix-action@v15
        with:
          name: meetscribe
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      - name: flake check (runs the unit suite)
        run: nix flake check --system ${{ matrix.system }} -L

      - name: build the package
        run: nix build .#packages.${{ matrix.system }}.default -L

      - name: build the pinned models
        run: nix build .#packages.${{ matrix.system }}.models -L

      # Prove the packaged CLI is wired: doctor exits with a report (non-zero is fine in CI —
      # there is no audio device — we only assert the app runs and produces output).
      - name: smoke — meetscribe doctor
        run: nix run .#doctor || true
