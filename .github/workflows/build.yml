name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-14        # Apple Silicon
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # A Cachix push step goes here once a cache exists (see flake.nix note). Until then the
      # build just runs without a binary cache.

      - name: flake check (runs the unit suite)
        run: nix flake check --system ${{ matrix.system }} -L

      - name: build the package
        run: nix build .#packages.${{ matrix.system }}.default -L

      - name: build the pinned models
        run: nix build .#packages.${{ matrix.system }}.models -L

      # Prove the packaged CLI is wired: doctor exits with a report (non-zero is fine in CI —
      # there is no audio device — we only assert the app runs and produces output).
      - name: smoke — meetscribe doctor
        run: nix run .#doctor || true
